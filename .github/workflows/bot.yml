name: Noon Deals Bot

on:
  schedule:
    - cron: '0 4,8,12,16,20,0 * * *'
  workflow_dispatch:

# Two runs must never overlap: both commit posted.json/state.json, and the loser
# of the race would push a state that forgets what the other already posted.
concurrency:
  group: noon-deals-bot
  cancel-in-progress: false

jobs:
  post-deals:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Akamai blocks GitHub Actions datacenter IPs regardless of TLS fingerprint.
      # Route noon.com traffic through Cloudflare WARP (free) to get a clean
      # consumer-routed egress IP. Telegram traffic bypasses the proxy.
      - name: Set up Cloudflare WARP
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc
          # warp-svc needs a moment before it'll accept CLI commands
          for i in {1..15}; do
            warp-cli --accept-tos status >/dev/null 2>&1 && break
            sleep 1
          done
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          # Wait for tunnel to come up
          for i in {1..30}; do
            if curl -fsS --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
              echo "WARP connected"
              break
            fi
            sleep 2
          done
          # Fail fast if WARP never came up — we do NOT want to silently fall back
          # to the datacenter IP and waste a run on Akamai 403s.
          curl -fsS --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NOON_COUPON_CODE: ${{ secrets.NOON_COUPON_CODE }}
          SCRAPER_PROXY: socks5h://127.0.0.1:40000
          # Crossposting is opt-in. With these unset the bot skips Facebook entirely.
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python main.py

      # always(): if the bot dies partway through posting it has already written
      # posted.json in a finally block — commit it or those deals get sent twice.
      # The job still reports failure; this step only preserves state.
      - name: Save posted products
        if: always()
        run: |
          git config user.name "Mohamed Gado"
          git config user.email "boogado@yahoo.com"
          # One at a time: `git add` on a path that does not exist yet is a fatal
          # error, and deals.json is missing until the first successful run.
          for f in posted.json state.json deals.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git pull --rebase origin main
          git push

  # The same deals, published as a static site Google can index. Runs even when
  # the scrape failed: the archive still holds a month of deals worth serving.
  publish-site:
    needs: post-deals
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5
        with:
          # post-deals has just pushed the updated deals.json.
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No `enablement: true` here: creating the Pages site needs admin scope
      # that GITHUB_TOKEN does not have, and the step fails with "Resource not
      # accessible by integration". Pages is already enabled on this repo with
      # build_type=workflow; a fork needs Settings > Pages > Source: GitHub Actions.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          # From configure-pages, so a custom domain later needs no code change.
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
          # Set this variable (Settings > Secrets and variables > Actions >
          # Variables) to move the site onto a domain you own. It writes the
          # CNAME file and rewrites every absolute URL; also point the DNS at
          # GitHub Pages. Worth doing before the site ranks, not after.
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          # Only needed to verify a *different* Search Console property (a fork,
          # or a new domain). Empty falls back to the token baked into
          # site_builder.py, so the default repo needs no variable set.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NOON_COUPON_CODE: ${{ secrets.NOON_COUPON_CODE }}
        run: python site_builder.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # After the deploy, never before: IndexNow crawlers fetch a submitted URL
      # within minutes, and one that still 404s because Pages has not swapped the
      # artifact yet gets dropped. Never fails the job — indexing is upside.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          # Public by design — it is served at /{key}.txt. A fork sets its own.
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: python indexnow.py
